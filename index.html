<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Copy Lab</title>
  <meta http-equiv="Cache-Control" content="no-store" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./dash-0645.css" />
</head>
<body>
  <div id="gate" class="gate">
    <div class="lang gate-lang" role="group" aria-label="Language">
      <button type="button" data-lang="pl">PL</button>
      <button type="button" data-lang="en">EN</button>
    </div>
    <p class="stamp">BUILD 06:45 UTC</p>
    <h1>Copy Lab</h1>
    <p class="lede" data-i18n="gate.lede"></p>
    <p id="gate-msg" class="msg"></p>
    <button class="btn primary" id="btn-google" type="button" hidden data-i18n="gate.google"></button>
    <label class="lbl" for="page-email" data-i18n="gate.email"></label>
    <input id="page-email" type="email" autocomplete="username" />
    <label class="lbl" for="page-code" data-i18n="gate.pass"></label>
    <input id="page-code" type="password" autocomplete="current-password" />
    <button class="btn primary" id="btn-code" type="button" data-i18n="gate.open"></button>
  </div>

  <div id="app" class="hidden" hidden>
    <header class="top">
      <div>
        <p class="brand">Copy Lab</p>
        <p class="brand-sub" data-i18n="top.sub"></p>
      </div>
      <nav class="nav" aria-label="Sections">
        <button type="button" class="on" data-view="do" data-i18n="nav.do"></button>
        <button type="button" data-view="sim" data-i18n="nav.sim"></button>
        <button type="button" data-view="poly" data-i18n="nav.poly"></button>
        <button type="button" data-view="money" data-i18n="nav.money"></button>
        <button type="button" data-view="how" data-i18n="nav.how"></button>
      </nav>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" id="lang-pl" data-lang="pl">PL</button>
        <button type="button" id="lang-en" data-lang="en">EN</button>
      </div>
      <p class="who" id="who"></p>
    </header>

    <div class="canvas">
      <section id="view-do">
        <div class="hero">
          <div>
            <p class="kicker" data-i18n="do.kicker"></p>
            <h1 data-i18n="do.title"></h1>
            <p data-i18n="do.lead"></p>
            <p style="margin-top:1rem">
              <button class="btn ghost jump" type="button" data-view="sim" data-i18n="do.jump"></button>
              <button class="btn ghost jump" type="button" data-view="poly" data-i18n="do.jumpPoly"></button>
            </p>
          </div>
          <aside class="status">
            <p class="kicker" data-i18n="do.copy"></p>
            <p class="off">OFF</p>
            <p class="kicker" data-i18n="do.cash"></p>
            <p class="cash" id="s-cash">—</p>
            <p class="muted"><span class="pulse"></span><span id="hunt-pulse">—</span></p>
          </aside>
        </div>
        <div class="steps">
          <article class="on">
            <p class="n">01</p>
            <h3 data-i18n="do.s1t"></h3>
            <p data-i18n="do.s1"></p>
          </article>
          <article>
            <p class="n">02</p>
            <h3 data-i18n="do.s2t"></h3>
            <p data-i18n="do.s2"></p>
          </article>
          <article>
            <p class="n">03</p>
            <h3 data-i18n="do.s3t"></h3>
            <p data-i18n="do.s3"></p>
          </article>
        </div>
        <p class="muted" data-i18n="do.warn"></p>
        <div class="section">
          <h2 data-i18n="lane.title"></h2>
          <p class="lead" data-i18n="lane.lead"></p>
          <p class="lane-head" id="lane-head">—</p>
          <div class="lanes" id="lane-grid"></div>
        </div>
        <div class="section">
          <h2 data-i18n="res.title"></h2>
          <p class="lead" data-i18n="res.lead"></p>
          <div class="cards research">
            <article>
              <p class="kicker" data-i18n="res.nowK"></p>
              <h3 data-i18n="res.nowT"></h3>
              <ul>
                <li data-i18n="res.now1"></li>
                <li data-i18n="res.now2"></li>
                <li data-i18n="res.now3"></li>
                <li data-i18n="res.now4"></li>
              </ul>
            </article>
            <article>
              <p class="kicker" data-i18n="res.nextK"></p>
              <h3 data-i18n="res.nextT"></h3>
              <ul>
                <li data-i18n="res.next1"></li>
                <li data-i18n="res.next2"></li>
                <li data-i18n="res.next3"></li>
                <li data-i18n="res.next4"></li>
              </ul>
            </article>
            <article>
              <p class="kicker" data-i18n="res.laterK"></p>
              <h3 data-i18n="res.laterT"></h3>
              <ul>
                <li data-i18n="res.later1"></li>
                <li data-i18n="res.later2"></li>
                <li data-i18n="res.later3"></li>
                <li data-i18n="res.later4"></li>
              </ul>
            </article>
          </div>
        </div>
      </section>

      <section id="view-poly" class="hidden" hidden>
        <div class="section roster">
          <h2 data-i18n="poly.title"></h2>
          <p class="lead" data-i18n="poly.lead"></p>
          <p class="off-line" data-i18n="poly.off"></p>
          <div id="poly-box"></div>
          <h3 class="kicker" style="margin-top:1.2rem" data-i18n="poly.pauseK"></h3>
          <ul class="roster-pause" id="poly-pause"></ul>
        </div>
      </section>

      <section id="view-sim" class="hidden" hidden>
        <div class="section">
          <h2 data-i18n="sim.title"></h2>
          <p class="lead" data-i18n="sim.lead"></p>
          <div class="paths">
            <article class="path on">
              <p class="kicker" data-i18n="sim.p1k"></p>
              <h3 data-i18n="sim.p1t"></h3>
              <p id="pred-a"></p>
            </article>
            <article class="path">
              <p class="kicker" data-i18n="sim.p2k"></p>
              <h3 data-i18n="sim.p2t"></h3>
              <p id="pred-b"></p>
            </article>
            <article class="path no">
              <p class="kicker" data-i18n="sim.p3k"></p>
              <h3 data-i18n="sim.p3t"></h3>
              <p id="pred-c"></p>
            </article>
          </div>
        </div>
        <div class="section">
          <h2 data-i18n="sim.charts"></h2>
          <p class="lead" data-i18n="sim.chartsLead"></p>
          <div class="charts">
            <figure>
              <p class="kicker">A</p>
              <h3 data-i18n="sim.aTitle"></h3>
              <p class="ask" data-i18n="sim.aAsk"></p>
              <canvas id="chart-funnel" height="210"></canvas>
              <p class="readout" id="read-funnel">—</p>
            </figure>
            <figure>
              <p class="kicker">B</p>
              <h3 data-i18n="sim.bTitle"></h3>
              <p class="ask" data-i18n="sim.bAsk"></p>
              <canvas id="chart-pnl" height="210"></canvas>
              <p class="readout" id="read-pnl">—</p>
            </figure>
            <figure>
              <p class="kicker">C</p>
              <h3 data-i18n="sim.cTitle"></h3>
              <p class="ask" data-i18n="sim.cAsk"></p>
              <canvas id="chart-conc" height="210"></canvas>
              <p class="readout" id="read-conc">—</p>
            </figure>
          </div>
        </div>
        <div class="section">
          <h2 data-i18n="sim.table"></h2>
          <p class="lead" id="hunt-plain"></p>
          <p class="lane-filter" id="lane-filter" hidden></p>
          <div class="table-wrap">
            <table class="cmp">
              <thead>
                <tr>
                  <th data-i18n="sim.thCall"></th>
                  <th data-i18n="sim.thWallet"></th>
                  <th>60d</th>
                  <th>90d</th>
                  <th data-i18n="sim.thDays"></th>
                  <th>Conc</th>
                  <th data-i18n="sim.thWhy"></th>
                </tr>
              </thead>
              <tbody id="field-body"></tbody>
            </table>
          </div>
        </div>
      </section>

      <section id="view-money" class="hidden" hidden>
        <div class="section">
          <h2 data-i18n="money.title"></h2>
          <p class="lead" data-i18n="money.lead"></p>
          <div class="kpis">
            <div><p class="kpi" id="m-cash">—</p><p class="lbl" data-i18n="money.cash"></p></div>
            <div><p class="kpi bad" id="s-live">—</p><p class="lbl" data-i18n="money.hole"></p></div>
            <div><p class="kpi">$15</p><p class="lbl" data-i18n="money.spend"></p></div>
            <div><p class="kpi">$31</p><p class="lbl" data-i18n="money.sl"></p></div>
          </div>
          <div class="cards">
            <article>
              <p class="kicker" data-i18n="money.k1"></p>
              <h3 data-i18n="money.t1"></h3>
              <p data-i18n="money.p1"></p>
            </article>
            <article>
              <p class="kicker" data-i18n="money.k2"></p>
              <h3 data-i18n="money.t2"></h3>
              <p data-i18n="money.p2"></p>
            </article>
            <article>
              <p class="kicker" data-i18n="money.k3"></p>
              <h3 data-i18n="money.t3"></h3>
              <p data-i18n="money.p3"></p>
            </article>
          </div>
        </div>
      </section>

      <section id="view-how" class="hidden" hidden>
        <div class="section">
          <h2 data-i18n="how.title"></h2>
          <p class="lead" data-i18n="how.lead"></p>
          <article class="faq">
            <h3 data-i18n="how.q1"></h3>
            <p data-i18n="how.a1"></p>
            <h3 data-i18n="how.q2"></h3>
            <p data-i18n="how.a2"></p>
            <h3 data-i18n="how.q3"></h3>
            <p data-i18n="how.a3"></p>
            <h3 data-i18n="how.q4"></h3>
            <p data-i18n="how.a4"></p>
            <h3 data-i18n="how.q5"></h3>
            <p data-i18n="how.a5"></p>
          </article>
          <div class="section">
            <h2 data-i18n="how.card"></h2>
            <p class="lead" data-i18n="how.cardLead"></p>
            <div id="override-box"></div>
            <h3 class="kicker" style="margin-top:1.2rem" data-i18n="how.ban"></h3>
            <ul class="ban" id="ban-list"></ul>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="./access-0645.js"></script>
  <script src="./dash-0645.js"></script>
</body>
</html>
